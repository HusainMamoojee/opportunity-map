<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI CV Matcher | OpportunityMap</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body style="background-color: #F8FAFC; font-family: 'Inter', sans-serif;">

    <!-- Minimal Navbar -->
    <nav class="navbar navbar-expand-lg bg-white border-bottom px-4 py-3">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-dark" href="/dashboard.html">
                🧭 Opportunity<span style="color: #0052FF;">Map</span>
            </a>
            <a href="/dashboard.html" class="btn btn-outline-secondary btn-sm">Back to Map</a>
        </div>
    </nav>

    <!-- Main Scanner Interface -->
    <div class="container mt-5 max-w-3xl" style="max-width: 800px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark">AI Career Matcher</h2>
            <p class="text-secondary">Paste your CV or resume below. Our AI engine will analyze your skills against live opportunities and find your top 3 perfect matches.</p>
        </div>

        <!-- Input Section -->
        <div class="card border-0 shadow-sm p-4 mb-4" style="border-radius: 12px;">
            <textarea id="cv-input" class="form-control mb-3" rows="10" placeholder="Paste your resume text, skills, or LinkedIn summary here..."></textarea>
            <button id="scan-btn" class="btn text-white w-100 py-2 fw-medium" style="background-color: #0052FF; border-radius: 8px;">
                Analyze & Find Matches
            </button>
        </div>

        <!-- Loading State (Hidden by default) -->
        <div id="loading-state" class="text-center d-none py-4">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p class="text-secondary mt-3 fw-medium">Running neural matching algorithms...</p>
        </div>

        <!-- Results Container -->
        <div id="results-container" class="mt-4">
            <!-- AI matches will be injected here -->
        </div>
    </div>

    <!-- Main Logic -->
    <script type="module" src="/src/main.js"></script>
</body>
</html>
